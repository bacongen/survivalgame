<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duc Anh IO Game</title>
    <link rel="stylesheet" href="style.css?v=2">

    <script src="globals.js?v=2" defer></script>
    <script src="entitylogic.js?v=2" defer></script>
    <script src="characterlogic.js?v=2" defer></script>
    <script src="maplogic.js?v=2" defer></script>
    <script src="main.js?v=2" defer></script>
</head>

<body>
    <div id="ui-container">

        <div id="controls-hint">
            [WASD / Arrows]: Move <br>
            [Left Click]: Attack/Gather <br>
            [1]: Sword · [2] or [E]: Wall mode, Click to build (5 Wood)
        </div>

        <div id="bottom-ui">
            <div id="health-bar-container">
                <div id="health-bar"></div>
            </div>

            <div id="hotbar">
                <div class="slot active">
                    <span class="key-num">1</span>
                    <img src="Sword_1.png?v=2" alt="Sword" style="width: 30px; height: 30px;">
                </div>
                <div class="slot">
                    <span class="key-num">2</span>
                    <div class="slot-icon" style="background: #666;"></div>
                </div>
                <div class="slot"><span class="key-num">3</span></div>
                <div class="slot"><span class="key-num">4</span></div>
                <div class="slot"><span class="key-num">5</span></div>
                <div class="slot"><span class="key-num">6</span></div>
                <div class="slot"><span class="key-num">7</span></div>

                <div class="slot">
                    <span class="key-num">8</span>
                    <div class="res-icon">🌲</div>
                    <span id="ui-wood-count" class="count">0</span>
                </div>
                <div class="slot">
                    <span class="key-num">9</span>
                    <div class="res-icon">🪨</div>
                    <span id="ui-stone-count" class="count">0</span>
                </div>
            </div>
        </div>

        <div id="minimap-container">
            <canvas id="minimap" width="150" height="150"></canvas>
        </div>
        <div id="game-over-screen" class="hidden">
            <h1>BẠN ĐÃ CHẾT!</h1>
            <p>Zombie đã ăn thịt bạn...</p>
            <button id="respawn-btn" onclick="respawnPlayer()">HỒI SINH</button>
        </div>
    </div>

    <canvas id="gameCanvas" tabindex="1" style="position:fixed;top:0;left:0;width:100vw;height:100vh;display:block"></canvas>
</body>

</html>
